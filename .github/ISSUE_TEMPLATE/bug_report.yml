name: 🐛 Bug report
description: Something is broken
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows, macOS, Linux, Android, iOS]
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: IOC Lens version }
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, expected vs actual. Do NOT paste API keys or sensitive indicators.
    validations: { required: true }
