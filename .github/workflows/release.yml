name: Release

# Publishes installers to GitHub Releases with STABLE file names, so the
# README links  .../releases/latest/download/<name>  always work.
# Trigger:  git tag v0.1.0 && git push origin v0.1.0   (or run manually)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            task: packageReleaseMsi
            dir: msi
            ext: msi
            out: IOC-Lens-windows-x64.msi
          - os: macos-latest            # Apple Silicon runner
            task: packageReleaseDmg
            dir: dmg
            ext: dmg
            out: IOC-Lens-macos-arm64.dmg
          - os: ubuntu-latest
            task: packageReleaseDeb
            dir: deb
            ext: deb
            out: IOC-Lens-linux-amd64.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Package
        run: ./gradlew :desktopApp:${{ matrix.task }} --no-daemon
      - name: Rename to stable name
        shell: bash
        run: |
          mkdir -p dist
          cp desktopApp/build/compose/binaries/main-release/${{ matrix.dir }}/*.${{ matrix.ext }} "dist/${{ matrix.out }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: dist/${{ matrix.out }}

  publish:
    needs: [desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum IOC-Lens-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
